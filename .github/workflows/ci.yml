name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_ENV: test
      # Disposable CI credentials. No local .env or repository secrets required.
      DATABASE_URL: postgresql://ci:ci_ephemeral@127.0.0.1:1/inventario
      TEST_DATABASE_URL: postgresql://ci:ci_ephemeral@127.0.0.1:5432/inventario_test
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci_ephemeral
      POSTGRES_DB: inventario
      POSTGRES_TEST_PASSWORD: ci_test_ephemeral
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_ephemeral
          POSTGRES_DB: inventario_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d inventario_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Validate Compose and Prisma configuration
        run: |
          docker compose --profile test config --quiet
          npm run prisma:validate
      - run: npm run build
      - run: npm run lint
      - run: npm run test:api
      - run: npm run test:api:e2e
      - run: npm run test:web
      - run: npm run test:api:integration
      - name: Query PostgreSQL through compiled Prisma/NestJS
        run: npm run db:check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Run compiled ESM HTTP smoke test
        run: npm run test:api:runtime
