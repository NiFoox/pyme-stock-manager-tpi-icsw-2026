name: inventario-pyme

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definir POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Definir POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  db-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-inventario_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Definir POSTGRES_TEST_PASSWORD}
      POSTGRES_DB: inventario_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
